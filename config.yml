# wenshucha 全站健康监控配置
# 每 15 分钟跑一次,连续 2 次失败发微信告警,SSL 14 天到期警告

global:
  timeout_sec: 15
  user_agent: "wenshucha-monitor/1.0"
  consecutive_fail_alert: 2     # 连续 N 次失败才告警(防误报)
  ssl_warn_days: 14             # 证书 < 14 天到期告警

# 检查目标(站点 + 各检查项)
sites:

  # ========== 文书查 To B 主站(腾讯云广州) ==========
  - name: wenshucha-main
    url: https://wenshucha.com/
    must_contain:
      - "深圳星谱网络科技"   # 页脚公司名,稳定
      - "文书查"           # 稳定词
      # ⚠️ 原有 "1.5 亿" 已删:规模口径随数据增长会变(现已 1.6 亿),
      #   查具体数字必周期性误报。同 sinoverdict 早学过的教训——内容检查只用稳定词,不用会变的数字。
    must_not_contain:
      - "Where are Wenshucha"      # 旧英文页防回归
      - "404 Not Found"
    max_response_ms: 8000
    check_response_ms: false   # 监控走海外VPN测国内直连腾讯站,响应时间被绕道污染(真实~0.3s);只保状态码+关键词+超时兜可用性
    check_ssl: true

  # ========== 律师工作台 ==========
  - name: lawyer-workbench
    url: https://tob.wenshucha.com/tob
    expected_status: [200, 301, 302, 307, 308]
    must_contain:
      - "文书查"       # 稳定品牌词
      - "工作台"       # 稳定功能词;⛔ 别加规模数字(同 1.5亿 教训)
    max_response_ms: 8000
    # 2026-08-23 biz-engine 补:本站 2026-08-12 已随三线一起从 Vercel 迁到腾讯云广州
    #   (dig tob.wenshucha.com = 114.132.74.235,国内直连),而监控跑在走 EPN 全局 VPN 的 Mac 上
    #   ⇒ 与 wenshucha-main 2026-07-29 那次「响应慢 169h 纯误报」是同一个根因,只是当时它还在
    #   Vercel 全球 CDN 上所以被判定「不受影响」——那条判定已随迁移过时。
    #   实测 2026-08-23 同一小时内 2567/3225/4855/4174/4499ms 正常,却夹着 21122ms 与 9011ms 两次
    #   越线,status 全程 200 ⇒ 站没问题,是测量路径被 VPN 污染,面板长期不全绿。
    #   按既有纪律置 false,可用性改由 状态码 + 上面两个关键词 + 15s 超时兜。
    check_response_ms: false
    check_ssl: true

  # ========== MCP 接入站 ==========
  - name: mcp-zh
    url: https://mcp.wenshucha.com/
    must_contain:
      - "文书查"
    max_response_ms: 8000   # Vercel cold start 可能首次慢
    check_ssl: true

  # ========== 海外英文站 SinoVerdict(2026-06-04 上线) ==========
  # 域名走 sinoverdict.wenshucha.com(主域子域,免买新域名),Vercel 部署 + 全球 CDN
  - name: sinoverdict-en
    url: https://sinoverdict.wenshucha.com/
    must_contain:
      - "SinoVerdict"
      - "Chinese"          # 稳定文案;原查"130M+"已过时(页面口径升级到170M),数字会变故改用稳定词
    must_not_contain:
      - "404 Not Found"
      - "Application error"
    max_response_ms: 8000   # 国内访问 Vercel 节点可能慢,放宽
    check_ssl: true

  - name: sinoverdict-robots
    url: https://sinoverdict.wenshucha.com/robots.txt
    must_contain:
      - "sinoverdict.wenshucha.com"
      - "Sitemap:"
    max_response_ms: 8000
    check_ssl: false   # robots.txt 不重复测 SSL,主站已测

  # ========== 赔了吗(4 个目标)— 2026-08-12 停用监控 ==========
  # 原因:赔了吗已由 Jack 于 2026-08-11 决定下架,域名与路由均已下线,
  #   `peilema.wenshucha.com` 现在连 DNS 记录都没有(dig 空,curl 000)。
  #   ⇒ 这 4 个目标是在监控一个「故意删掉的产品」,必然永久失败:
  #   自 08-11 02:43 起已连续红 36 小时,并会一直红下去。
  #   监控里长期挂着一批永远红的目标,代价是真故障被淹没
  #   ——jacktrader(唯一现金流资产)08-11 才刚补进本监控(BL-088),
  #   如果面板常态是 10/15 红,它真掛的那天没人会看。
  # 恢复方法:若赔了吗重新上线,取消下面注释即可(配置原样保留,未删)。
  # - name: peilema-main
  #   url: https://peilema.wenshucha.com/
  #   must_contain:
  #     - "赔了吗"
  #   must_not_contain:
  #     - "Application error"
  #     - "Internal Server Error"
  #   max_response_ms: 6000
  #   check_ssl: true
  #
  # - name: peilema-xhs
  #   url: https://peilema.wenshucha.com/xhs
  #   expected_status: [200, 301, 302, 307, 308]
  #   max_response_ms: 6000
  #
  # - name: peilema-sample
  #   url: https://peilema.wenshucha.com/sample
  #   expected_status: [200]
  #   max_response_ms: 5000
  #
  # - name: peilema-service
  #   url: https://peilema.wenshucha.com/service
  #   expected_status: [200]
  #   max_response_ms: 5000

  # ========== 数据满屋(同机房,顺手监控) ==========
  - name: datahouseful
    url: https://www.datahouseful.com/
    expected_status: [200, 301, 302]
    max_response_ms: 8000
    check_ssl: false      # SSL 证书 SAN 不含 www 子域,但服务正常
    verify_ssl: false     # 跳过 HTTPS 证书验证(hostname mismatch)
    check_response_ms: false   # 同机房腾讯直连,监控走海外VPN测响应时间被污染

  # ========== 文书查旧 URL 防回归(必须仍是 redirect 页) ==========
  - name: wenshucha-legacy-contact
    url: https://wenshucha.com/contact.html
    must_contain:
      - "文书查"           # 该旧URL现已是真实内容页(非跳转桩),用稳定词
    must_not_contain:
      - "Where are Wenshucha"
    max_response_ms: 5000
    check_response_ms: false

  - name: wenshucha-legacy-server1
    url: https://wenshucha.com/server1.html
    must_contain:
      - "文书查"           # 该旧URL现已是真实内容页(非跳转桩),用稳定词
    must_not_contain:
      - "Government Solution"
    max_response_ms: 5000
    check_response_ms: false

  # ========== jacktrader.xyz 返佣站(2026-08-11 补入) ==========
  # 为什么现在才加:今天 Vercel 整帐号 402 封禁(FAIR_USE_LIMITS_EXCEEDED),
  #   本站跟 sinoverdict/tob 一起掛了 13 小时,而它是唯一有现金流的资产(1-2万/月),
  #   却是本监控 12 个目标里唯一没被覆盖的——盲点靠 biz-engine 巡检偶然发现,不是监控发现的。
  # 只查状态码 + 品牌稳定词;⛔ 不查返佣百分比(口径数字会调,查数字必周期性误报,同 1.5亿 的教训)。
  - name: jacktrader-home
    url: https://www.jacktrader.xyz/
    must_contain:
      - "JackTrader"
    max_response_ms: 8000
    check_ssl: true

  - name: jacktrader-en
    url: https://www.jacktrader.xyz/en/
    must_contain:
      - "JackTrader"
    max_response_ms: 8000

  # GEO 资产:AI 引擎抓这份当事实源(见 project_jacktrader_geo_system),掛了等于 GEO 断供
  - name: jacktrader-llms
    url: https://www.jacktrader.xyz/llms-full.txt
    must_contain:
      - "JackTrader"
    max_response_ms: 8000

  # ========== jacktrader 出站「钱路」监控(2026-08-23 biz-engine Line C 补入) ==========
  # 为什么加:BL-088 补的是「站活着吗」,但站活着 ≠ 钱路活着。全站 70 个文件里的注册 CTA
  #   只有两个出站链接(OKX join/TRADERJACK 128 处、Binance ref=MPZQWSDC 129 处),
  #   而它们走的是交易所的**镜像域**,链路上还有会轮换的随机 .org 域(实测
  #   promooboost.com → wjgfczxklby.org → btmwjnxqvkf.org,中间一跳是 base64 混淆的 JS 跳转)。
  #   任何一跳失效 = 全站唯一现金流路径静默断掉,而站本身照样绿。今天以前零监控。
  # ⛔ 三条纪律:①不查返佣百分比(会变,同 1.5亿 教训);②镜像链末端域会轮换,故**不**对
  #   随机 .org 域做 must_contain_after_redirect,否则轮换即误报;③只查「能不能到、码有没有被吞」。
  # ⚠️ 诚实边界:这三条都**证明不了推荐码还在计佣**——它们只证明链路可达、码没在跳转中被剥掉。
  #   真正的绑定发生在浏览器端 JS / 交易所后台,headless 验不了(2026-08-23 已实测确认)。

  # ① OKX 官方域自证:标题会渲染出 "My referral code: traderjack"。
  #    这是唯一一条能在交易所自己域名上把码读出来的检查(镜像链读不到)。
  #    红了 = 码在 OKX 侧不再解析(账号被停/码被改),比站掛更严重。
  - name: jacktrader-okx-refcode
    url: https://www.okx.com/join/TRADERJACK
    must_contain:
      - "traderjack"
    must_contain_after_redirect:
      - "okx.com"
    max_response_ms: 15000
    check_response_ms: false   # 交易所站走 EPN 出口,响应时间不可信;只兜可达性

  # ② OKX 镜像链第一跳:全站 128 处 CTA 的实际入口。
  #    只查状态码——末端域(wjgfczxklby.org 之类)会轮换,查内容必周期性误报。
  - name: jacktrader-okx-mirror
    url: https://www.promooboost.com/join/TRADERJACK
    expected_status: [200]
    max_response_ms: 15000
    check_response_ms: false

  # ③ Binance 镜像链:验「最终落在 binance.com 且 ref= 码还在」。
  #    Binance 对非浏览器 UA 一律回 202 + 空 body(实测),故不能查关键词,只能查 final_url。
  #    这条恰恰是最该查的——镜像若把 ref 参数吞掉,页面照样 200、佣金归零,肉眼看不出来。
  - name: jacktrader-binance-ref
    url: https://www.bsmkweb.cc/join?ref=MPZQWSDC
    expected_status: [200, 202]
    must_contain_after_redirect:
      - "binance.com"
      - "ref=MPZQWSDC"
    max_response_ms: 15000
    check_response_ms: false

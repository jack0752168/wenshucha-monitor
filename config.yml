# wenshucha 全站健康监控配置
# 每 15 分钟跑一次,连续 2 次失败发微信告警,SSL 14 天到期警告

global:
  timeout_sec: 15
  user_agent: "wenshucha-monitor/1.0"
  consecutive_fail_alert: 2     # 连续 N 次失败才告警(防误报)
  ssl_warn_days: 14             # 证书 < 14 天到期告警

# 检查目标(站点 + 各检查项)
sites:

  # ========== 文书查 To B 主站(腾讯云广州) ==========
  - name: wenshucha-main
    url: https://wenshucha.com/
    must_contain:
      - "深圳星谱网络科技"   # 页脚公司名,稳定
      - "文书查"           # 稳定词
      # ⚠️ 原有 "1.5 亿" 已删:规模口径随数据增长会变(现已 1.6 亿),
      #   查具体数字必周期性误报。同 sinoverdict 早学过的教训——内容检查只用稳定词,不用会变的数字。
    must_not_contain:
      - "Where are Wenshucha"      # 旧英文页防回归
      - "404 Not Found"
    max_response_ms: 8000
    check_response_ms: false   # 监控走海外VPN测国内直连腾讯站,响应时间被绕道污染(真实~0.3s);只保状态码+关键词+超时兜可用性
    check_ssl: true

  # ========== 律师工作台 ==========
  - name: lawyer-workbench
    url: https://tob.wenshucha.com/tob
    expected_status: [200, 301, 302, 307, 308]
    max_response_ms: 8000
    check_ssl: true

  # ========== MCP 接入站 ==========
  - name: mcp-zh
    url: https://mcp.wenshucha.com/
    must_contain:
      - "文书查"
    max_response_ms: 8000   # Vercel cold start 可能首次慢
    check_ssl: true

  # ========== 海外英文站 SinoVerdict(2026-06-04 上线) ==========
  # 域名走 sinoverdict.wenshucha.com(主域子域,免买新域名),Vercel 部署 + 全球 CDN
  - name: sinoverdict-en
    url: https://sinoverdict.wenshucha.com/
    must_contain:
      - "SinoVerdict"
      - "Chinese"          # 稳定文案;原查"130M+"已过时(页面口径升级到170M),数字会变故改用稳定词
    must_not_contain:
      - "404 Not Found"
      - "Application error"
    max_response_ms: 8000   # 国内访问 Vercel 节点可能慢,放宽
    check_ssl: true

  - name: sinoverdict-robots
    url: https://sinoverdict.wenshucha.com/robots.txt
    must_contain:
      - "sinoverdict.wenshucha.com"
      - "Sitemap:"
    max_response_ms: 8000
    check_ssl: false   # robots.txt 不重复测 SSL,主站已测

  # ========== 赔了吗(4 个目标)— 2026-08-12 停用监控 ==========
  # 原因:赔了吗已由 Jack 于 2026-08-11 决定下架,域名与路由均已下线,
  #   `peilema.wenshucha.com` 现在连 DNS 记录都没有(dig 空,curl 000)。
  #   ⇒ 这 4 个目标是在监控一个「故意删掉的产品」,必然永久失败:
  #   自 08-11 02:43 起已连续红 36 小时,并会一直红下去。
  #   监控里长期挂着一批永远红的目标,代价是真故障被淹没
  #   ——jacktrader(唯一现金流资产)08-11 才刚补进本监控(BL-088),
  #   如果面板常态是 10/15 红,它真掛的那天没人会看。
  # 恢复方法:若赔了吗重新上线,取消下面注释即可(配置原样保留,未删)。
  # - name: peilema-main
  #   url: https://peilema.wenshucha.com/
  #   must_contain:
  #     - "赔了吗"
  #   must_not_contain:
  #     - "Application error"
  #     - "Internal Server Error"
  #   max_response_ms: 6000
  #   check_ssl: true
  #
  # - name: peilema-xhs
  #   url: https://peilema.wenshucha.com/xhs
  #   expected_status: [200, 301, 302, 307, 308]
  #   max_response_ms: 6000
  #
  # - name: peilema-sample
  #   url: https://peilema.wenshucha.com/sample
  #   expected_status: [200]
  #   max_response_ms: 5000
  #
  # - name: peilema-service
  #   url: https://peilema.wenshucha.com/service
  #   expected_status: [200]
  #   max_response_ms: 5000

  # ========== 数据满屋(同机房,顺手监控) ==========
  - name: datahouseful
    url: https://www.datahouseful.com/
    expected_status: [200, 301, 302]
    max_response_ms: 8000
    check_ssl: false      # SSL 证书 SAN 不含 www 子域,但服务正常
    verify_ssl: false     # 跳过 HTTPS 证书验证(hostname mismatch)
    check_response_ms: false   # 同机房腾讯直连,监控走海外VPN测响应时间被污染

  # ========== 文书查旧 URL 防回归(必须仍是 redirect 页) ==========
  - name: wenshucha-legacy-contact
    url: https://wenshucha.com/contact.html
    must_contain:
      - "文书查"           # 该旧URL现已是真实内容页(非跳转桩),用稳定词
    must_not_contain:
      - "Where are Wenshucha"
    max_response_ms: 5000
    check_response_ms: false

  - name: wenshucha-legacy-server1
    url: https://wenshucha.com/server1.html
    must_contain:
      - "文书查"           # 该旧URL现已是真实内容页(非跳转桩),用稳定词
    must_not_contain:
      - "Government Solution"
    max_response_ms: 5000
    check_response_ms: false

  # ========== jacktrader.xyz 返佣站(2026-08-11 补入) ==========
  # 为什么现在才加:今天 Vercel 整帐号 402 封禁(FAIR_USE_LIMITS_EXCEEDED),
  #   本站跟 sinoverdict/tob 一起掛了 13 小时,而它是唯一有现金流的资产(1-2万/月),
  #   却是本监控 12 个目标里唯一没被覆盖的——盲点靠 biz-engine 巡检偶然发现,不是监控发现的。
  # 只查状态码 + 品牌稳定词;⛔ 不查返佣百分比(口径数字会调,查数字必周期性误报,同 1.5亿 的教训)。
  - name: jacktrader-home
    url: https://www.jacktrader.xyz/
    must_contain:
      - "JackTrader"
    max_response_ms: 8000
    check_ssl: true

  - name: jacktrader-en
    url: https://www.jacktrader.xyz/en/
    must_contain:
      - "JackTrader"
    max_response_ms: 8000

  # GEO 资产:AI 引擎抓这份当事实源(见 project_jacktrader_geo_system),掛了等于 GEO 断供
  - name: jacktrader-llms
    url: https://www.jacktrader.xyz/llms-full.txt
    must_contain:
      - "JackTrader"
    max_response_ms: 8000
